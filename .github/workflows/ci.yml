name: CI

on:
  push:
    branches: ['**']   # tags go through the release workflow
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.cc }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      # The upstream/ submodule isn't needed: the tests use the copies in
      # tests/fixtures/upstream/.
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libpcre2-dev libnetfilter-queue-dev libnftnl-dev libmnl-dev libnghttp2-dev libprotobuf-c-dev libgtk2.0-dev libsqlite3-dev
      - name: build
        run: make CC=${{ matrix.cc }}
      - name: unit tests
        run: make CC=${{ matrix.cc }} test
      - name: unit tests (ASan + UBSan)
        run: make CC=${{ matrix.cc }} asan
      # the downloader task (CURL=1) against a local HTTP server
      - name: unit tests (CURL=1)
        run: |
          sudo apt-get install -y libcurl4-openssl-dev
          make CC=${{ matrix.cc }} CURL=1 BUILD=build/curl test

  # Phase 3+: the daemon in a network namespace (nftables, nfqueue, curl).
  # As root: the runners don't allow unprivileged user namespaces.
  integration:
    name: integration (${{ matrix.build }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        build: [plain, asan]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libpcre2-dev libnetfilter-queue-dev libnftnl-dev libmnl-dev libnghttp2-dev libprotobuf-c-dev libgtk2.0-dev libsqlite3-dev nftables curl python3 openssl python3-grpcio python3-grpc-tools xvfb xdotool libnotify-dev python3-gi dbus
      - name: integration tests
        run: |
          if [ "${{ matrix.build }}" = asan ]; then
            sudo make BUILD=build/asan SANITIZE=1 test-integration
          else
            sudo make test-integration
          fi

  valgrind:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libpcre2-dev libnetfilter-queue-dev libnftnl-dev libmnl-dev libnghttp2-dev libprotobuf-c-dev libgtk2.0-dev libsqlite3-dev valgrind
      - run: make valgrind

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libpcre2-dev libnetfilter-queue-dev libnftnl-dev libmnl-dev libnghttp2-dev libprotobuf-c-dev libgtk2.0-dev libsqlite3-dev cppcheck
      - run: make lint

  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libpcre2-dev libnetfilter-queue-dev libnftnl-dev libmnl-dev libnghttp2-dev libprotobuf-c-dev libgtk2.0-dev libsqlite3-dev
      - name: fuzz smoke run (60s per target)
        run: make fuzz-run FUZZ_TIME=60

  # Phase 6 interoperability: our UI with upstream's own daemon (the pinned
  # tag, built from the submodule), in a network namespace on Xvfb.
  interop-ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - run: sudo apt-get update && sudo apt-get install -y libpcre2-dev libnetfilter-queue-dev libnftnl-dev libmnl-dev libnghttp2-dev libprotobuf-c-dev libgtk2.0-dev libsqlite3-dev protobuf-compiler nftables curl python3 xvfb xdotool
      - name: build upstream's daemon
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.26.0
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.0.1
          export PATH="$PATH:$(go env GOPATH)/bin"
          (cd upstream/proto && protoc -I. ui.proto \
              --go_out=../daemon/ui/protocol/ --go-grpc_out=../daemon/ui/protocol/ \
              --go_opt=paths=source_relative --go-grpc_opt=paths=source_relative)
          mkdir -p build
          (cd upstream/daemon && go build -o "$GITHUB_WORKSPACE/build/opensnitchd-upstream" .)
      - run: make
      - name: our UI with upstream's daemon (and with ours)
        run: |
          sudo env OPENSNITCHD="$PWD/build/opensnitchd-upstream" KISNITCHD="$PWD/build/kisnitchd" \
              KISNITCH_GTK="$PWD/build/kisnitch-gtk" tests/integration/ui.sh
      # Phase 8: the same system-fw.json files give the same ruleset with
      # upstream's daemon, and switching iptables <-> nftables leaves nothing.
      - name: system firewall, ours and upstream's daemon
        run: |
          sudo apt-get install -y iptables
          sudo env OPENSNITCHD="$PWD/build/opensnitchd-upstream" KISNITCHD="$PWD/build/kisnitchd" \
              tests/integration/sysfw.sh

  # Phase 6 differential test: the same pop-up cases through upstream's
  # Python pop-up code (Qt replaced by stand-ins) and through ours.
  diff-ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - run: sudo apt-get update && sudo apt-get install -y libpcre2-dev libnetfilter-queue-dev libnftnl-dev libmnl-dev libnghttp2-dev libprotobuf-c-dev libgtk2.0-dev libsqlite3-dev python3-protobuf python3-grpc-tools python3-slugify python3-unidecode
      - run: make diff-ui

  # Phase 1 differential test: the same corpus through upstream's Go rules
  # package and through ours.
  diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - run: sudo apt-get update && sudo apt-get install -y libpcre2-dev libnetfilter-queue-dev libnftnl-dev libmnl-dev libnghttp2-dev libprotobuf-c-dev libgtk2.0-dev libsqlite3-dev protobuf-compiler
      - run: make diff
